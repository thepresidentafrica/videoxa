name: Build and Push Docker Image
on:
  push:
    branches:
      - main

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GIT_TOKEN }}

    - name: Build and Push Docker Image
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/videoxa:latest .
        docker push ghcr.io/${{ github.repository_owner }}/videoxa:latest
  deploy:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
          - name: Checkout code
            uses: actions/checkout@v2
      
          - name: Deploy to Azure Web App
            uses: azure/webapps-deploy@v2
            with:
              app-name: 'vf400'
              images: 'ghcr.io/${{ github.repository_owner }}/videoxa:latest'
      
